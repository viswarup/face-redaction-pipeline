<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Box 1: Video Ingest -->
  <rect x="15" y="80" width="115" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="72" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Input Video</text>
  <text x="72" y="136" fill="#94a3b8" font-size="10.5" text-anchor="middle">SHA-256 Digest</text>
  <text x="72" y="152" fill="#64748b" font-size="9" text-anchor="middle">Idempotent Queue</text>

  <line x1="130" y1="125" x2="165" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box 2: Dual Detection & Pose Fusion -->
  <rect x="165" y="60" width="150" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="88" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">1. Dual Detection</text>
  <text x="240" y="112" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">SCRFD-34G (Face)</text>
  <text x="240" y="132" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">+ YOLOv8 (Pose)</text>
  <text x="240" y="156" fill="#2563eb" font-size="9.5" font-weight="600" text-anchor="middle">Fuses head &amp; shoulders</text>
  <text x="240" y="172" fill="#64748b" font-size="8.5" text-anchor="middle">Rescues 25.8% blind spots</text>

  <line x1="315" y1="125" x2="350" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box 3: Motion Tracking & Smoothing -->
  <rect x="350" y="60" width="155" height="130" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="427" y="88" fill="#7e22ce" font-size="13" font-weight="bold" text-anchor="middle">2. Motion Tracking</text>
  <text x="427" y="112" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">ByteTrack + Kalman</text>
  <text x="427" y="132" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Gap Interpolation</text>
  <text x="427" y="156" fill="#7e22ce" font-size="9.5" font-weight="600" text-anchor="middle">-88.1% Flicker Flashes</text>
  <text x="427" y="172" fill="#64748b" font-size="8.5" text-anchor="middle">3,101 frames rescued</text>

  <line x1="505" y1="125" x2="540" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box 4: Heavy Redaction -->
  <rect x="540" y="60" width="145" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="612" y="88" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">3. Heavy Redaction</text>
  <text x="612" y="112" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">+28% Box Dilation</text>
  <text x="612" y="132" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Gaussian σ=25 Blur</text>
  <text x="612" y="156" fill="#b45309" font-size="9.5" font-weight="600" text-anchor="middle">+63.8% area expansion</text>
  <text x="612" y="172" fill="#64748b" font-size="8.5" text-anchor="middle">Covers hair, ears &amp; jaw</text>

  <line x1="685" y1="125" x2="720" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box 5: Independent Auditor -->
  <rect x="720" y="60" width="140" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="790" y="88" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">4. Secondary QA</text>
  <text x="790" y="112" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">RetinaFace Verifier</text>
  <text x="790" y="132" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Audits Rendered MP4</text>
  <text x="790" y="156" fill="#15803d" font-size="9.5" font-weight="600" text-anchor="middle">Zero-Trust Inspection</text>
  <text x="790" y="172" fill="#64748b" font-size="8.5" text-anchor="middle">Prevents self-bias</text>

  <!-- Split Outputs -->
  <line x1="860" y1="108" x2="895" y2="78" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <rect x="880" y="52" width="75" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="917" y="77" fill="#14532d" font-size="10.5" font-weight="bold" text-anchor="middle">SAFE</text>

  <line x1="860" y1="142" x2="895" y2="172" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <rect x="880" y="152" width="75" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="917" y="172" fill="#7f1d1d" font-size="9" font-weight="bold" text-anchor="middle">NEEDS_</text>
  <text x="917" y="186" fill="#7f1d1d" font-size="9" font-weight="bold" text-anchor="middle">REVIEW</text>

  <!-- Bottom Annotation -->
  <text x="480" y="235" fill="#475569" font-size="11" font-style="italic" text-anchor="middle">
    SQLite WAL Store tracks deduplication, audit trails, and reviewer decisions across every pipeline stage
  </text>
</svg>
